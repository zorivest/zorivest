name: Bug Report
description: Report a bug in Zorivest
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for taking the time to report a bug! Please fill out the fields below to help us investigate.

  - type: input
    id: version
    attributes:
      label: Zorivest Version
      description: "The version of Zorivest you're using (e.g., v0.1.0). Find it in Settings → About."
      placeholder: "v0.1.0"
    validations:
      required: true

  - type: dropdown
    id: install-type
    attributes:
      label: Installation Type
      description: "How did you install Zorivest?"
      options:
        - Windows Installer (.exe setup)
        - Portable (.exe, no installation)
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: "A clear description of what the bug is."
      placeholder: "Describe what happened and what you expected to happen."
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: "Step-by-step instructions to reproduce the bug."
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. See error
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Log Excerpt
      description: "If applicable, paste relevant log output. Logs are in the app's data directory."
      render: text
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: "Any other context, screenshots, or information about the problem."
    validations:
      required: false
