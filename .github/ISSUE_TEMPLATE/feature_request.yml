name: Feature Request
description: Suggest a new feature or improvement for Zorivest
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for suggesting a feature! We appreciate your input in making Zorivest better.

  - type: textarea
    id: problem
    attributes:
      label: Problem Description
      description: "What problem does this feature solve? Is it related to a frustration?"
      placeholder: "I'm always frustrated when..."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: "Describe the solution you'd like."
      placeholder: "I would like Zorivest to..."
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: "Any alternative solutions or features you've considered."
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: "Any other context, screenshots, or mockups for the feature request."
    validations:
      required: false
